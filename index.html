<meta name="robots" content="noindex,nofollow">
<title>案件管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap">
<style>
:root{
  --ground:#EDF0EE; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#16201D; --ink-2:#4A5853; --ink-3:#77847F;
  --line:#D1D9D5; --line-2:#E3E8E6;
  --accent:#224C74; --accent-ink:#FFFFFF; --accent-soft:#E1E9F2;
  --shu:#C8392D;
  --ok:#2A7549; --ok-soft:#E1F0E6; --warn:#94600E; --warn-soft:#FAEFD9; --crit:#B3261E; --crit-soft:#FAE4E1; --info:#35658B; --info-soft:#E3ECF3;
  --paper:#FFFFFF; --paper-ink:#141414; --paper-line:#3A3A3A; --paper-head:#EEF1F0; --paper-shu:#C8392D;
  --r:6px;
  --shadow:0 1px 2px rgba(18,30,26,.06),0 6px 20px rgba(18,30,26,.07);
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --serif:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101615; --surface:#19211F; --surface-2:#1F2927; --ink:#E2E8E5; --ink-2:#A2AEA9; --ink-3:#7C8984;
    --line:#2E3A37; --line-2:#26302E;
    --accent:#8FB4DB; --accent-ink:#0E1A26; --accent-soft:#1D2D3E;
    --shu:#E4665B;
    --ok:#62BD88; --ok-soft:#18301F; --warn:#DDAA4A; --warn-soft:#33280F; --crit:#EF6D61; --crit-soft:#3A1916; --info:#86B2D6; --info-soft:#18293A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#101615; --surface:#19211F; --surface-2:#1F2927; --ink:#E2E8E5; --ink-2:#A2AEA9; --ink-3:#7C8984;
  --line:#2E3A37; --line-2:#26302E;
  --accent:#8FB4DB; --accent-ink:#0E1A26; --accent-soft:#1D2D3E;
  --shu:#E4665B;
  --ok:#62BD88; --ok-soft:#18301F; --warn:#DDAA4A; --warn-soft:#33280F; --crit:#EF6D61; --crit-soft:#3A1916; --info:#86B2D6; --info-soft:#18293A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---- shell ---- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--serif);font-size:19px;letter-spacing:.06em}
.brand small{color:var(--ink-3);font-size:11px;letter-spacing:.12em}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:700;font-size:13px}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav a:hover{color:var(--ink)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.me select{padding:4px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on::before{background:var(--ok)} .sync.local::before{background:var(--warn)}
.wrap{max-width:1320px;margin:0 auto;padding:24px 20px 120px}
.bottomnav{display:none}
@media (max-width:760px){
  .nav,.brand small,.me .sync{display:none}
  .top-in{padding:0 14px;gap:10px}
  .wrap{padding:16px 12px 150px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{flex:1;text-align:center;padding:10px 0 8px;font-size:11px;font-weight:700;color:var(--ink-3);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--accent)}
  .bottomnav a b{display:block;font-size:15px;line-height:1.2}
}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.muted{color:var(--ink-3)} .small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.04em}
.pagehead .sub{color:var(--ink-3);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.banner{padding:10px 14px;border-radius:var(--r);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.info{background:var(--info-soft);color:var(--info)} .banner.crit{background:var(--crit-soft);color:var(--crit)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---- list ---- */
.attn{margin-bottom:22px}
.attn h2{font-size:13px;letter-spacing:.1em;color:var(--ink-2);margin-bottom:8px}
.attn ul{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.attn li a{display:grid;grid-template-columns:6px minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;padding:9px 14px 9px 0;background:var(--surface);text-decoration:none;color:var(--ink)}
.attn li a:hover{background:var(--surface-2)}
.attn .sev{align-self:stretch;background:var(--ink-3)}
.attn .sev.crit{background:var(--crit)} .attn .sev.warn{background:var(--warn)} .attn .sev.info{background:var(--info)}
.attn .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn .msg{color:var(--ink-2);font-size:13px}
@media (max-width:760px){.attn li a{grid-template-columns:5px 1fr;row-gap:2px}.attn .msg,.attn .go{grid-column:2}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.filters input{min-width:200px}
.seg-f{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg-f button{border:0;background:transparent;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
.seg-f button:last-child{border-right:0}
.seg-f button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.list th{font-size:11px;letter-spacing:.08em;color:var(--ink-3);text-align:left;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
table.list td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr.click{cursor:pointer}
table.list tbody tr.click:hover td{background:var(--surface-2)}
.cname{font-weight:700;font-size:14px}
.cname a{color:var(--ink);text-decoration:none}
.cmeta{font-size:11.5px;color:var(--ink-3)}
.cards{display:none}
@media (max-width:760px){
  .tbl-wide{display:none}
  .cards{display:grid;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;text-decoration:none;color:var(--ink)}
}

/* ---- step track ---- */
.trk{display:flex;align-items:center;gap:0}
.trk i{width:22px;height:8px;border-radius:2px;background:var(--line);margin-right:3px;position:relative}
.trk i.done{background:var(--accent)}
.trk i.wait{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.trk i.back{background:var(--warn)}
.trk i.locked{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);outline:1px solid var(--line);outline-offset:-1px}
.flowv{list-style:none;margin:0;padding:0}
.flowv li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:0 0 14px;position:relative}
.flowv li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.flowv li:last-child::before{display:none}
.flowv .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);position:relative;z-index:1}
.flowv .done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flowv .wait .dot{border-color:var(--accent);color:var(--accent)}
.flowv .back .dot{border-color:var(--warn);color:var(--warn)}
.flowv .locked .dot{border-style:dashed}
.flowv .t{font-weight:700;font-size:13px;line-height:22px}
.flowv .d{font-size:12px;color:var(--ink-3);line-height:1.5}
.flowv .d.crit{color:var(--crit)} .flowv .d.warn{color:var(--warn)}

/* ---- gauge ---- */
.gauge{display:flex;align-items:center;gap:8px;min-width:130px}
.gauge .bar{position:relative;flex:1;height:6px;background:var(--line-2);border-radius:3px;min-width:70px}
.gauge .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ok)}
.gauge.over .bar i{background:var(--crit)}
.gauge .bar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.gauge span{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.gauge.over span{color:var(--crit)} .gauge.ok span{color:var(--ok)}
.gauge.na span{color:var(--ink-3);font-weight:400}

/* ---- case page ---- */
.casehead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.casehead h1{font-family:var(--serif);font-size:26px;letter-spacing:.03em;line-height:1.3}
.casehead h1 small{font-size:16px;color:var(--ink-2);margin-left:8px}
.casegrid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}
.flowcol{position:sticky;top:72px;display:grid;gap:14px}
.flowcol .panel{padding:14px 16px}
.flowcol h3{font-size:12px;letter-spacing:.1em;color:var(--ink-2);margin-bottom:10px}
.acts{display:grid;gap:8px;margin-top:4px}
.acts .why{font-size:11.5px;color:var(--ink-3);margin-top:-4px}
@media (max-width:960px){.casegrid{grid-template-columns:1fr}.flowcol{position:static}}
.stamps{display:flex;gap:10px;flex-wrap:wrap}
.stampbox{display:grid;justify-items:center;gap:4px;min-width:62px}
.stampbox .role{font-size:11px;color:var(--ink-2);font-weight:700}
.stamp{display:inline-grid;place-items:center;align-content:center;width:48px;height:48px;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--serif);transform:rotate(-8deg);line-height:1.05}
.stamp b{font-size:13px;letter-spacing:.02em}
.stamp i{font-style:normal;font-size:9px;border-top:1px solid currentColor;padding-top:2px;margin-top:2px}
.stamp.empty{border:1.5px dashed var(--line);color:var(--ink-3);transform:none;font-family:var(--sans);font-size:11px}
.stamp.ng{border-color:var(--warn);color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:0}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--surface-2);color:var(--ink-3)}
.tabs .cnt.full{background:var(--ok-soft);color:var(--ok)}
.formwrap{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:6px 22px 22px}
@media (max-width:760px){.formwrap{padding:4px 14px 18px}}
.fs{padding:18px 0 4px;border-top:1px solid var(--line-2)}
.fs:first-child{border-top:0}
.fs>h3{font-size:13px;font-weight:700;letter-spacing:.06em;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.fs>h3 .muted{font-weight:400;letter-spacing:0;font-size:12px}
.fs>p.lead{margin:-6px 0 12px;color:var(--ink-3);font-size:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.f{display:grid;gap:4px;align-content:start;min-width:0}
.f.w2{grid-column:span 2} .f.w3{grid-column:span 3} .f.wf{grid-column:1/-1}
@media (max-width:560px){.f.w2,.f.w3{grid-column:1/-1}}
.f>label,.f>.lb{font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.f .req{font-style:normal;font-size:10px;color:var(--crit);font-weight:700;letter-spacing:.05em}
.f.miss input,.f.miss select,.f.miss textarea{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.f small{font-size:11px;color:var(--ink-3)}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=url],.f select,.f textarea,.inp{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:36px}
.f textarea{resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.suffix{display:flex;align-items:center;gap:6px}
.suffix span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;cursor:pointer;background:var(--surface)}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--accent)}
.posbox{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.posbox>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.posbox>header b{font-size:13px}
.calc{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2);padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface);margin-top:12px}
.calc b{color:var(--ink);font-variant-numeric:tabular-nums}
.calc .ng{color:var(--crit)} .calc .okc{color:var(--ok)}
.shifts{display:grid;gap:6px;margin-top:4px}
.shift{display:grid;grid-template-columns:104px 124px 12px 124px 76px 124px 12px 124px 56px 28px;gap:6px;align-items:center}
.tsel{display:flex;align-items:center;gap:2px}
.tsel select{flex:1;min-width:0;padding:6px 2px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:34px;font-variant-numeric:tabular-nums}
.tsel span{color:var(--ink-3)}
.merit{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.7fr) minmax(0,1.2fr);gap:10px 14px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line-2)}
.merit:last-child{border-bottom:0}
@media (max-width:700px){.merit{grid-template-columns:1fr}}
.shift .h{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.shift .x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px}
.shift input{padding:6px 7px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:34px;width:100%}
.shift-head{font-size:10.5px;color:var(--ink-3);font-weight:700}
@media (max-width:900px){.shift{grid-template-columns:1fr 1fr 1fr;}.shift .sep{display:none}.shift-head{display:none}}
.money{display:grid;grid-template-columns:auto auto auto 1fr;gap:2px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
.money .r{text-align:right}
.money .tot{border-top:1px solid var(--line);padding-top:4px;font-weight:700}
.kg{display:grid;gap:0}
.kg .q{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);align-items:start}
.kg .q .ql{font-size:12.5px}
.kg .q .ql small{display:block;color:var(--ink-3);font-size:11px}
.kg .cat{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700;padding:14px 0 4px}
@media (max-width:700px){.kg .q{grid-template-columns:1fr}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);color:var(--surface);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.savebar[hidden]{display:none!important}
.savebar input{min-width:260px;padding:7px 10px;border-radius:var(--r);border:1px solid transparent;background:var(--surface);color:var(--ink)}
.savebar .btn{border-color:transparent}
@media (max-width:760px){.savebar{bottom:calc(52px + env(safe-area-inset-bottom));padding:8px 12px}.savebar input{min-width:0;flex:1 1 100%}}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.hist .when{font-size:11.5px;color:var(--ink-3)}
.hist table{font-size:12px;border-collapse:collapse;margin-top:6px;width:100%}
.hist td{padding:3px 8px 3px 0;vertical-align:top;border-top:1px dotted var(--line-2)}
.hist td:first-child{color:var(--ink-2);white-space:nowrap;width:1%}
.hist del{color:var(--ink-3)} .hist ins{text-decoration:none;font-weight:700}
.notes{display:grid;gap:8px;margin-top:10px;max-height:260px;overflow:auto}
.note{font-size:12.5px;padding:8px 10px;background:var(--surface-2);border-radius:var(--r)}
.note .when{font-size:11px;color:var(--ink-3)}

/* ---- documents ---- */
.doctools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.docs{display:grid;gap:24px;justify-items:center}
.sheet{background:var(--paper);color:var(--paper-ink);width:100%;max-width:820px;padding:28px 30px;box-shadow:var(--shadow);border:1px solid var(--line)}
table.form{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px;line-height:1.45;color:var(--paper-ink)}
table.form td{border:1px solid var(--paper-line);padding:4px 6px;vertical-align:middle;word-break:break-all}
table.form td.h{background:var(--paper-head);font-weight:700;text-align:center;font-size:11px}
table.form td.title{border:0;text-align:center;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.5em;padding:4px 0 14px}
table.form td.sec{border-left:0;border-right:0;font-weight:700;padding-top:12px;font-size:12px;background:transparent}
table.form td.tall{height:64px;vertical-align:top}
table.form td.c{text-align:center} table.form td.n{text-align:right}
table.form td.over{color:#B3261E;font-weight:700}
table.form td.stamp-cell{height:64px;text-align:center}
table.form td.blank{border:0}
table.form .pstamp{display:inline-grid;place-items:center;align-content:center;width:46px;height:46px;border:2px solid var(--paper-shu);border-radius:50%;color:var(--paper-shu);font-family:var(--serif);transform:rotate(-8deg);line-height:1.05}
table.form .pstamp b{font-size:12px} table.form .pstamp i{font-style:normal;font-size:8.5px;border-top:1px solid currentColor;padding-top:1px;margin-top:2px}
table.form .pstamp.ng{border-color:#94600E;color:#94600E}
.adtext{white-space:pre-wrap;font-size:13px;line-height:1.8}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff}
  .top,.bottomnav,.doctools,.savebar,#toast,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{box-shadow:none;border:0;padding:0;max-width:none;page-break-after:always}
}

/* ---- postings ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.tile{background:var(--surface);padding:12px 16px}
.tile .k{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.tile.warn .v{color:var(--warn)} .tile.crit .v{color:var(--crit)}
table.board td.m{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
table.board td.m .cnt{font-weight:700;font-size:14px}
table.board td.m a{font-size:11px;margin-left:3px}
table.board td.m .fx{display:block;font-size:10.5px}
table.board tr.grp td{background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--ink-2);padding:6px 12px}
table.board tr.open td{background:var(--accent-soft)}
table.board tr.detail>td{background:var(--surface-2);padding:16px}
.fxd{color:var(--ink-3)} .fxd.warn{color:var(--warn);font-weight:700} .fxd.crit{color:var(--crit);font-weight:700}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr}}
.pgrid .panel{padding:14px 16px}
.pgrid h4{font-size:12px;letter-spacing:.08em;color:var(--ink-2);margin:0 0 10px}
table.ptab{width:100%;border-collapse:collapse;font-size:12.5px}
table.ptab th{font-size:10.5px;color:var(--ink-3);text-align:left;padding:4px 4px;font-weight:700;white-space:nowrap}
table.ptab td{padding:3px 4px;border-top:1px solid var(--line-2);vertical-align:middle}
table.ptab input,table.ptab select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0;font-size:12.5px}
table.ptab input.n{text-align:right;font-variant-numeric:tabular-nums}
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
.funnel div{background:var(--surface);padding:8px 10px}
.funnel .k{font-size:10.5px;color:var(--ink-3);font-weight:700}
.funnel .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.funnel .p{font-size:10.5px;color:var(--ink-3)}
.bars{display:grid;gap:4px;font-size:12px}
.bars .b{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center}
.bars .b i{display:block;height:8px;border-radius:2px;background:var(--accent)}
.bars .b span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.spark{color:var(--accent)}
.spark text{fill:var(--ink-3);font-size:9px}
.ai{border-top:1px solid var(--line-2);margin-top:12px;padding-top:12px}
.ai .issue{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-bottom:1px dotted var(--line)}
.ai .issue .chip{align-self:start}
.ai .issue p{margin:0;font-size:12.5px}
.ai .issue p.act{color:var(--ink)} .ai .issue p.fd{color:var(--ink-2)}
table.kbn input.sug{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
table.kbn td{vertical-align:middle}
label.btn[for]{cursor:pointer}
.unreg{margin-top:26px}
.unreg h2{font-size:13px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:4px}

/* ---- settings ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.sgrid .panel{padding:16px 18px}
.sgrid h3{font-size:13px;margin-bottom:4px}
.sgrid p{margin:0 0 10px;color:var(--ink-3);font-size:12px}
.sgrid textarea{width:100%;min-height:120px;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12.5px;line-height:1.6}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;display:grid;gap:6px;justify-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow)}
#toast div.warn{background:var(--warn);color:#fff}
@media (prefers-reduced-motion:no-preference){#toast div{animation:tin .18s ease-out}}
@keyframes tin{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
</style>

<script>
/* 画面の更新が利用者に届くようにする仕組み
   ・JavaScriptは5分ごとに新しいものを取りにいく
   ・version.json の版番号がこのページより新しければ、自動で読み直す */
const APP_VERSION = "202609171404";
(function () {
  var files = ["config.js","ref.js","core.js","caseview.js","docs.js","postings.js","ads.js","xlsxfill.js","main.js"];
  var q = "?v=" + Math.floor(Date.now() / 300000);
  files.forEach(function (f) {
    var el = document.createElement("script");
    el.src = f + q; el.async = false;   // 読み込む順番を保つ
    document.head.appendChild(el);
  });
  fetch("version.json?nc=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.version && j.version !== APP_VERSION && !location.search.includes("v=" + j.version)) {
        location.replace(location.pathname + "?v=" + j.version + location.hash);
      }
    })
    .catch(function () { });
})();
</script>
