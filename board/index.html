async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase error ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* 失敗の理由を日本語にする。「失敗しました」だけだと、接続先が落ちているのか
   設定の問題なのか切り分けられず、原因を探すのに時間がかかるため。 */
function describeError(e) {
  const msg = String((e && e.message) || e);
  if (/Failed to fetch|NetworkError|ERR_NAME_NOT_RESOLVED|Load failed/i.test(msg)) {
    return "Supabaseに接続できません。プロジェクトが一時停止している可能性があります"
         + "(無料プランは一定期間アクセスがないと自動で停止します)。"
         + "Supabaseのダッシュボードを開き、一時停止中なら再開ボタン"
         + "(日本語表示では「履歴書プロジェクト」と誤訳されています)を押してください。";
  }
  const m = msg.match(/Supabase error (\d{3})/);
  if (m) {
    const code = m[1];
    if (code === "401" || code === "403") return `Supabaseに接続を拒否されました(${code})。接続キーかテーブルのポリシー設定を確認してください。`;
    if (code === "404") return `jobsテーブルが見つかりません(404)。setup.sql を実行してください。`;
    if (code === "413") return `一度に送るデータが大きすぎます(413)。`;
    if (code === "429") return `リクエストが多すぎます(429)。少し待ってからやり直してください。`;
    if (code.charAt(0) === "5") return `Supabase側でエラーが起きています(${code})。少し待ってからやり直してください。`;
    return `Supabaseがエラーを返しました(${code})。`;
  }
  return msg;
}

const KB_COL_MAP = {

function cleanNum(v) {
  if (v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/[¥￥%,\s]/g, ""));
  return Number.isFinite(n) ? n : 0;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function toDate(iso) { return new Date(iso + "T00:00:00"); }
function daysBetween(a, b) { return Math.round((a.getTime() - b.getTime()) / 86400000); }
function fmtInt(n) { return Math.round(n).toLocaleString("ja-JP"); }
function fmtPct(n) {
  if (n === null || n === undefined || !Number.isFinite(n)) return "—";
  return n.toFixed(2) + "%";
}
/* ファイル名から取り込み日(スナップショット日)を割り出す。
   エアワーク  : ..._YYYYMMDD_HHMMSS.csv   → 出力日
   求人ボックス: ..._YYYYMMDD_YYYYMMDD.csv → 集計期間の開始日と終了日 */
function extractPeriod(filename) {
  const kb = filename.match(/_(\d{4})(\d{2})(\d{2})_(\d{4})(\d{2})(\d{2})\.csv$/i);
  if (kb) return { start: `${kb[1]}-${kb[2]}-${kb[3]}`, date: `${kb[4]}-${kb[5]}-${kb[6]}` };
  const aw = filename.match(/(\d{4})(\d{2})(\d{2})_\d{6}\.csv$/i);
  if (aw) return { start: null, date: `${aw[1]}-${aw[2]}-${aw[3]}` };
  return { start: null, date: todayStr() };
}

/* エアワークはUTF-8(BOM付き)、求人ボックスはShift_JISで出力されるため、
   バイト列を見て文字コードを判定してから読む。 */
async function readCsvText(file) {
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
    return new TextDecoder("utf-8").decode(buf);
  }
  try {
    return new TextDecoder("utf-8", { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder("shift_jis").decode(buf);
  }
}

/* 押したボタンの拠点を、実際に取り込む媒体の拠点に読み替える。
   例: エアワークの「plus-i」ボタンに求人BOXのCSVを入れた場合は「plus」にする。
   そのままだとタブに存在しない拠点が生まれ、求人が一覧から消えてしまう。 */
function resolveBranch(sourceId, branchId) {
  const branches = branchesOf(sourceId);
  if (branches.some((b) => b.id === branchId)) return branchId;
  const near = branches.find((b) => branchId.startsWith(b.id) || b.id.startsWith(branchId));
  return (near || branches[0]).id;
}

/* ヘッダーの列名から媒体を判定する(ボタンを押し間違えても正しく取り込めるように) */
function detectSource(row) {
  if (!row) return null;
  if ("求人タイトル" in row || "表示回数" in row) return "kyujinbox";
  if ("求人内容" in row || "表示数" in row) return "airwork";
  return null;
}
function extractCompany(memo) {
  if (!memo) return "";
  const tokens = memo.split(/[\s\u3000]+/).map((t) => t.trim()).filter(Boolean);
  if (tokens.length === 0) return "";
  if (tokens.length === 1) return tokens[0];
  return /^\d+$/.test(tokens[0]) ? (tokens[1] || tokens[0]) : tokens[0];
}

/* CSVの1行を共通の形に変換する。
   null を返した行は無視、"skip" を返した行は「意図的に取り込まない行」。 */
function parseAirworkRow(row, fallbackBranch) {
  const id = row["求人番号"];
  if (!id || String(id).trim() === "合計") return null;
  const stats = {};
  Object.entries(AW_COL_MAP).forEach(([jp, key]) => { stats[key] = cleanNum(row[jp]); });
  const memo = (row["求人メモ"] || "").trim();
  return {
    jobId: String(id).trim(),
    branch: fallbackBranch,
    title: (row["求人内容"] || "").trim(),
    memo,
    company: extractCompany(memo),
    employmentType: (row["雇用形態"] || "").trim(),
    stats,
  };
}

/* 求人ボックスのCSVは plus / next / up が1ファイルにまとまって出力されるため、
   「勤務先名」から拠点を振り分ける。判定できない行だけボタンで選んだ拠点に入れる。 */
function kbBranch(workplaceName, fallbackBranch) {
  const s = workplaceName || "";
  if (s.includes("next")) return "next";
  if (s.includes("up")) return "up";
  if (s.includes("plus")) return "plus";
  return fallbackBranch;
}
function parseKyujinboxRow(row, fallbackBranch) {
  const id = row["求人番号"];
  if (!id || String(id).trim() === "合計") return null;
  const status = (row["ステータス"] || "").trim();
  if (status === "募集停止") return "skip";
  const stats = {};
  Object.entries(KB_COL_MAP).forEach(([jp, key]) => { stats[key] = cleanNum(row[jp]); });
  const workplace = (row["勤務先名"] || "").trim();
  const memo = [(row["勤務地"] || "").trim(), workplace, (row["キャンペーン名"] || "").trim()]
    .filter(Boolean).join(" ・ ");
  return {
    jobId: "kb:" + String(id).trim(),
    branch: kbBranch(workplace, fallbackBranch),
    title: (row["求人タイトル"] || "").trim(),
    memo,
    /* 求人ボックスのCSVに顧客企業名は含まれないため、企業名は詳細画面で手入力する */
    company: "",
    employmentType: (row["雇用形態"] || "").trim(),
    status,
    stats,
  };
}
function nextReminder(today = new Date()) {
  const day = today.getDate();
  const isToday = REMINDER_DAYS.includes(day);
  let daysUntil = null;
  if (!isToday) {
    const upcoming = REMINDER_DAYS.find((d) => d > day);
    if (upcoming) {
      daysUntil = upcoming - day;
    } else {
      const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 10);
      daysUntil = daysBetween(nextMonth, today);
    }
  }
  return { isToday, daysUntil };
}

/* 2つの取り込み時点のあいだに増えたクリック数。
   エアワークは掲載開始からの累計なので単純な差分でよいが、求人ボックスは
   「集計期間の合計」なので、期間の起点が変わった取り込み同士では差分を取らず、
   その期間の値をそのまま増分として扱う。 */
function clicksDelta(job, fromD, toD) {
  const a = job.snapshots[fromD], b = job.snapshots[toD];
  if (!b) return 0;
  if (!a) return b.clicks;
  const sameWindow = (a.periodStart || null) === (b.periodStart || null);
  return sameWindow ? Math.max(b.clicks - a.clicks, 0) : b.clicks;
}

function deriveJobMetrics(job, today = new Date()) {
  const snapDates = Object.keys(job.snapshots || {}).sort();
  if (snapDates.length === 0) {
    return { snapDates, latest: null, latestDate: null, lastRevision: null, elapsedDays: null, clicksPerDaySinceRevision: null, preAvgClicksPerDay: null, postAvgClicksPerDay: null, changePct: null };
  }
  const latestDate = snapDates[snapDates.length - 1];
  const latest = job.snapshots[latestDate];
  const revisions = [...(job.revisions || [])].sort();
  const lastRevision = revisions.length ? revisions[revisions.length - 1] : null;

  let elapsedDays = null, clicksPerDaySinceRevision = null, preAvgClicksPerDay = null, postAvgClicksPerDay = null, changePct = null;

  if (lastRevision) {
    elapsedDays = Math.max(daysBetween(today, toDate(lastRevision)), 0);
    const preDatesAll = snapDates.filter((d) => d < lastRevision);
    const postDatesAll = snapDates.filter((d) => d >= lastRevision);
    const baselineDate = preDatesAll.length ? preDatesAll[preDatesAll.length - 1] : null;

    if (postDatesAll.length) {
      const postLatestDate = postDatesAll[postDatesAll.length - 1];
      const baseDateForAvg = baselineDate || postDatesAll[0];
      const deltaClicks = clicksDelta(job, baseDateForAvg, postLatestDate);
      const deltaDays = Math.max(daysBetween(toDate(postLatestDate), toDate(baseDateForAvg)), 1);
      postAvgClicksPerDay = deltaClicks / deltaDays;
      clicksPerDaySinceRevision = elapsedDays > 0 ? deltaClicks / elapsedDays : postAvgClicksPerDay;
    }
    if (baselineDate && preDatesAll.length >= 2) {
      const prevDate = preDatesAll[preDatesAll.length - 2];
      const deltaClicks = clicksDelta(job, prevDate, baselineDate);
      const deltaDays = Math.max(daysBetween(toDate(baselineDate), toDate(prevDate)), 1);
      preAvgClicksPerDay = deltaClicks / deltaDays;
    }
    if (preAvgClicksPerDay !== null && preAvgClicksPerDay > 0 && postAvgClicksPerDay !== null) {
      changePct = ((postAvgClicksPerDay - preAvgClicksPerDay) / preAvgClicksPerDay) * 100;
    }
  }
  return { snapDates, latest, latestDate, lastRevision, elapsedDays, clicksPerDaySinceRevision, preAvgClicksPerDay, postAvgClicksPerDay, changePct };
}

/* Supabase(PostgREST)は1回のGETで最大1000件しか返さない。
   ページングしないと、それを超えた分が画面に出てこない。 */
async function fetchAllJobRows() {
  const PAGE = 1000;
  const rows = [];
  for (let from = 0; ; from += PAGE) {
    let page;
    try {
      page = await sbFetch("jobs?select=*&order=job_id", {
        headers: { "Range-Unit": "items", "Range": `${from}-${from + PAGE - 1}` },
      });
    } catch (e) {
      /* 総件数がちょうどPAGEの倍数だと、最後に範囲外を要求して416が返る */
      if (String(e.message).includes("416")) break;
      throw e;
    }
    const list = page || [];
    rows.push(...list);
    if (list.length < PAGE) break;
  }
  return rows;
}

async function loadAllJobs() {
  const rows = await fetchAllJobRows();
  const jobs = {};
  (rows || []).forEach((r) => {
    jobs[r.job_id] = {
      jobId: r.job_id,
      branch: r.branch,
      title: r.title,
      memo: r.memo,
      company: r.company,
      companyManual: !!r.company_manual,
      employmentType: r.employment_type,
      revisions: r.revisions || [],
      titleHistory: r.title_history || [],
      snapshots: r.snapshots || {},
      createdAt: r.created_at,
      updatedAt: r.updated_at,
    };
  });
  return jobs;
}
function jobPayload(job) {
  return {
    job_id: job.jobId,
    branch: job.branch,
    title: job.title,
    memo: job.memo,
    company: job.company,
    company_manual: !!job.companyManual,
    employment_type: job.employmentType,
    revisions: job.revisions || [],
    title_history: job.titleHistory || [],
    snapshots: job.snapshots || {},
    updated_at: new Date().toISOString(),
  };
}
async function saveJob(job) {
  await saveJobs([job]);
}
/* 求人ボックスのCSVは数千行あるため、1件ずつではなくまとめて送る */
async function saveJobs(jobList) {
  const CHUNK = 500;
  for (let i = 0; i < jobList.length; i += CHUNK) {
    const payload = jobList.slice(i, i + CHUNK).filter(Boolean).map(jobPayload);
    if (!payload.length) continue;
    try {
      await sbFetch("jobs", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      /* どこまで保存できたかが分かるようにしてから投げ直す */
      throw new Error(`${jobList.length}件中${i}件を保存した時点で中断しました。${e.message}`);
    }
  }
}
async function deleteJobStorage(jobId) {
  await sbFetch(`jobs?job_id=eq.${encodeURIComponent(jobId)}`, {
    method: "DELETE",
    headers: { "Prefer": "return=minimal" },
  });
}
/* まとめて削除。1件ずつ消すとURL1本につき1件で何千回も往復するため、
   in.(...) に詰めて送る。URLが長くなりすぎないよう200件ずつに割る。 */
async function deleteJobsStorage(ids) {
  const CHUNK = 200;
  for (let i = 0; i < ids.length; i += CHUNK) {
    const list = ids.slice(i, i + CHUNK).map((id) => encodeURIComponent(`"${id}"`)).join(",");
    await sbFetch(`jobs?job_id=in.(${list})`, {
      method: "DELETE",
      headers: { "Prefer": "return=minimal" },
    });
  }
}

   メインコンポーネント
================================================================== */

function JobAdDashboard() {
  const [jobs, setJobs] = useState({});
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [busyBranch, setBusyBranch] = useState(null);
  const [selectedJobId, setSelectedJobId] = useState(null);
  const [toast, setToast] = useState(null);
  /* 削除の確認ダイアログ。{ label, ids } を入れると開く */
  const [confirmDel, setConfirmDel] = useState(null);
  const [delBusy, setDelBusy] = useState(false);
  const [lastImport, setLastImport] = useState({});
  const [activeSource, setActiveSource] = useState("airwork");
  const [activeTab, setActiveTab] = useState("all");
  const [searchText, setSearchText] = useState("");
  const [sortMode, setSortMode] = useState("priority");
  const [impFilter, setImpFilter] = useState("all");
  /* 最新の取り込みに載っているかどうかの絞り込み(古い求人の掃除用) */
  const [freshFilter, setFreshFilter] = useState("all");
  /* 一括で修正日を登録するための選択状態(求人番号の集合) */
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [bulkDate, setBulkDate] = useState(todayStr());
  const [bulkBusy, setBulkBusy] = useState(false);
  const fileInputs = useRef({});
  const backupInputRef = useRef(null);
  const toastTimer = useRef(null);
  /* 取り込み中に最新のjobsを同期的に読むための控え */
  const jobsRef = useRef({});

  useEffect(() => { jobsRef.current = jobs; }, [jobs]);

  useEffect(() => {
    (async () => {
      try {
        const loaded = await loadAllJobs();
        setJobs(loaded);
        setLoadError(null);
      } catch (e) {
        setLoadError(describeError(e));
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  function showToast(msg, kind = "ok") {
    setToast({ msg, kind });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    /* エラーは読む時間が要るので長めに出す */
    toastTimer.current = setTimeout(() => setToast(null), kind === "error" ? 14000 : 3400);
  }

  const reminder = useMemo(() => nextReminder(), []);

  const handleFiles = useCallback(async (sourceId, branchId, fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setBusyBranch(`${sourceId}:${branchId}`);

    let totalRows = 0, newJobs = 0, revisedJobs = 0, skippedRows = 0;
    const branchCounts = {};
    const mismatched = [];
    /* 保存に失敗した場合、成功メッセージを出してはいけない
       (保存されていないのに保存できたと誤解させてしまうため) */
    let saveError = null;

    for (const file of files) {
      const period = extractPeriod(file.name);
      const snapshotDate = period.date;
      try {
        let text, rows;
        try {
          text = await readCsvText(file);
          rows = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
        } catch (e) {
          showToast(`${file.name} を読み込めませんでした。CSVの形式を確認してください。`, "error");
          continue;
        }
        /* ボタンを押し間違えても列名から媒体を判定して正しく取り込む */
        const fileSource = detectSource(rows[0]) || sourceId;
        if (fileSource !== sourceId) mismatched.push(SOURCE_BY_ID[fileSource].label);
        const fallbackBranch = resolveBranch(fileSource, branchId);

        const records = [];
        rows.forEach((row) => {
          const rec = fileSource === "kyujinbox"
            ? parseKyujinboxRow(row, fallbackBranch)
            : parseAirworkRow(row, fallbackBranch);
          if (rec === "skip") { skippedRows += 1; return; }
          if (rec) records.push(rec);
        });
        totalRows += records.length;

        const next = { ...jobsRef.current };
        const touched = [];
        records.forEach((rec) => {
          const { jobId, title, memo, branch, employmentType } = rec;
          const stats = period.start ? { ...rec.stats, periodStart: period.start } : rec.stats;
          if (rec.status) stats.status = rec.status;
          const existing = next[jobId];
          branchCounts[branch] = (branchCounts[branch] || 0) + 1;

          if (!existing) {
            newJobs += 1;
            next[jobId] = {
              jobId, branch, title, memo, company: rec.company, companyManual: false,
              employmentType, revisions: [], titleHistory: [{ date: snapshotDate, title }],
              snapshots: { [snapshotDate]: stats },
              createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
            };
          } else {
            const revisions = new Set(existing.revisions || []);
            let titleHistory = existing.titleHistory || [{ date: existing.createdAt?.slice(0, 10) || snapshotDate, title: existing.title }];
            if (existing.title && title && existing.title !== title) {
              revisions.add(snapshotDate);
              titleHistory = [...titleHistory, { date: snapshotDate, title }];
              revisedJobs += 1;
            }
            next[jobId] = {
              ...existing, branch, title, memo,
              company: existing.companyManual ? existing.company : (rec.company || existing.company),
              employmentType, revisions: Array.from(revisions).sort(), titleHistory,
              snapshots: { ...existing.snapshots, [snapshotDate]: stats },
              updatedAt: new Date().toISOString(),
            };
          }
          touched.push(next[jobId]);
        });

        jobsRef.current = next;
        setJobs(next);
        await saveJobs(touched);
      } catch (e) {
        /* 画面には反映済みなので、保存だけが失敗したことが分かる文言にする */
        saveError = `画面には反映しましたが、Supabaseへの保存に失敗しました。再読み込みすると取り込んだ内容は消えます。${describeError(e)}`;
      }
    }

    setBusyBranch(null);
    if (saveError) {
      showToast(saveError, "error");
      return;
    }
    setLastImport((prev) => ({ ...prev, [`${sourceId}:${branchId}`]: { date: todayStr(), count: totalRows } }));
    if (totalRows) {
      const label = mismatched.length ? mismatched[0] : SOURCE_BY_ID[sourceId].label;
      let msg = `${label}として${totalRows}件の求人データを取り込みました`;
      const detail = [];
      if (newJobs) detail.push(`新規${newJobs}件`);
      if (revisedJobs) detail.push(`修正検知${revisedJobs}件`);
      if (skippedRows) detail.push(`募集停止${skippedRows}件は対象外`);
      const branchDetail = Object.entries(branchCounts).map(([b, c]) => `${b} ${c}件`).join(" / ");
      if (branchDetail) detail.push(branchDetail);
      if (detail.length) msg += `(${detail.join("・")})`;
      showToast(msg);
    } else if (skippedRows) {
      showToast(`取り込める求人がありませんでした(募集停止${skippedRows}件は対象外)`, "error");
    }
  }, []);

  function addRevision(jobId, dateStr) {
    setJobs((prev) => {
      const job = prev[jobId];
      if (!job) return prev;
      const revisions = Array.from(new Set([...(job.revisions || []), dateStr])).sort();
      const updated = { ...job, revisions, updatedAt: new Date().toISOString() };
      saveJob(updated).catch(() => showToast("保存に失敗しました", "error"));
      return { ...prev, [jobId]: updated };
    });
    showToast("修正日を記録しました");
  }
  /* 一覧でチェックした求人に、まとめて同じ修正日を登録する */
  async function addRevisionToSelected(dateStr) {
    const ids = Array.from(selectedIds);
    if (!ids.length || !dateStr) return;
    setBulkBusy(true);
    const next = { ...jobsRef.current };
    const touched = [];
    ids.forEach((id) => {
      const job = next[id];
      if (!job) return;
      const revisions = Array.from(new Set([...(job.revisions || []), dateStr])).sort();
      next[id] = { ...job, revisions, updatedAt: new Date().toISOString() };
      touched.push(next[id]);
    });
    jobsRef.current = next;
    setJobs(next);
    try {
      await saveJobs(touched);
      setSelectedIds(new Set());
      showToast(`${touched.length}件に修正日(${dateStr})を登録しました`);
    } catch (e) {
      showToast(`画面には反映しましたが、Supabaseへの保存に失敗しました。再読み込みすると登録した修正日は消えます。${describeError(e)}`, "error");
    } finally {
      setBulkBusy(false);
    }
  }

  function toggleSelect(jobId) {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(jobId)) next.delete(jobId); else next.add(jobId);
      return next;
    });
  }

  function removeRevision(jobId, dateStr) {
    setJobs((prev) => {
      const job = prev[jobId];
      if (!job) return prev;
      const revisions = (job.revisions || []).filter((d) => d !== dateStr);
      const updated = { ...job, revisions, updatedAt: new Date().toISOString() };
      saveJob(updated).catch(() => {});
      return { ...prev, [jobId]: updated };
    });
  }
  function updateJobInfo(jobId, fields) {
    setJobs((prev) => {
      const job = prev[jobId];
      if (!job) return prev;
      const updated = { ...job, ...fields, updatedAt: new Date().toISOString() };
      saveJob(updated).catch(() => {});
      return { ...prev, [jobId]: updated };
    });
  }
  function deleteJob(jobId) {
    setJobs((prev) => { const next = { ...prev }; delete next[jobId]; return next; });
    deleteJobStorage(jobId).catch(() => {});
    if (selectedJobId === jobId) setSelectedJobId(null);
    showToast("求人データを削除しました");
  }
  function askDelete(label, ids) {
    if (!ids.length) return;
    setConfirmDel({ label, ids });
  }
  /* 先にSupabaseから消してから画面に反映する。
     途中で失敗したときに、画面だけ消えて実際は残っている状態を作らないため。 */
  async function runDelete() {
    const ids = confirmDel.ids;
    setDelBusy(true);
    try {
      await deleteJobsStorage(ids);
      const next = { ...jobsRef.current };
      ids.forEach((id) => { delete next[id]; });
      jobsRef.current = next;
      setJobs(next);
      setSelectedIds((prev) => { const n = new Set(prev); ids.forEach((id) => n.delete(id)); return n; });
      if (ids.includes(selectedJobId)) setSelectedJobId(null);
      setConfirmDel(null);
      showToast(`${ids.length}件を削除しました`);
    } catch (e) {
      showToast(`削除に失敗しました。${describeError(e)}`, "error");
    } finally {
      setDelBusy(false);
    }
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(jobs, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `job-ad-dashboard-backup_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("バックアップをダウンロードしました");
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        setJobs((prev) => {
          const next = { ...prev, ...data };
          Object.values(data).forEach((job) => saveJob(job).catch(() => {}));
          return next;
        });
        showToast(`${Object.keys(data).length}件の求人データを復元しました`);
      } catch (e) {
        showToast("バックアップファイルの読み込みに失敗しました", "error");
      }
    };
    reader.readAsText(file);
  }

  /* 拠点ごとの「いちばん新しい取り込み日」。
     拠点によって取り込む日が違うので、古いかどうかは拠点の中で比べる。 */
  const latestByBranch = useMemo(() => {
    const out = {};
    Object.values(jobs).forEach((j) => {
      const d = Object.keys(j.snapshots || {}).sort().pop();
      if (!d) return;
      const k = `${sourceOf(j.jobId)}:${j.branch}`;
      if (!out[k] || d > out[k]) out[k] = d;
    });
    return out;
  }, [jobs]);
  const lastImportOf = (job) => Object.keys(job.snapshots || {}).sort().pop() || "";
  /* その拠点の最新の取り込みに載っていない＝掲載が終わった可能性がある求人 */
  const isStale = (job) => {
    const d = lastImportOf(job);
    const latest = latestByBranch[`${sourceOf(job.jobId)}:${job.branch}`];
    return !!(d && latest && d < latest);
  };

  const ranked = useMemo(() => {
    let source = Object.values(jobs).filter((j) => sourceOf(j.jobId) === activeSource);
    if (activeTab !== "all") source = source.filter((j) => j.branch === activeTab);
    const q = searchText.trim().toLowerCase();
    if (q) {
      source = source.filter((j) => (j.company || "").toLowerCase().includes(q) || (j.title || "").toLowerCase().includes(q));
    }
    if (freshFilter !== "all") {
      source = source.filter((j) => (freshFilter === "stale" ? isStale(j) : !isStale(j)));
    }
    let list = source.map((job) => ({ job, m: deriveJobMetrics(job) }));
    if (impFilter !== "all") {
      list = list.filter(({ m }) => {
        const imp = m.latest ? m.latest.impressions : 0;
        return impFilter === "shown" ? imp > 0 : imp === 0;
      });
    }
    if (sortMode === "company") {
      list.sort((a, b) => (a.job.company || "").localeCompare(b.job.company || "", "ja"));
    } else {
      list.sort((a, b) => {
        const aImp = a.m.latest ? a.m.latest.impressions : 0;
        const bImp = b.m.latest ? b.m.latest.impressions : 0;
        if ((aImp === 0) !== (bImp === 0)) return aImp === 0 ? 1 : -1;
        const aApplies = a.m.latest ? a.m.latest.applies : 0;
        const bApplies = b.m.latest ? b.m.latest.applies : 0;
        if (aApplies !== bApplies) return aApplies - bApplies;
        const aCtr = a.m.latest ? a.m.latest.ctr : 0;
        const bCtr = b.m.latest ? b.m.latest.ctr : 0;
        if (aCtr !== bCtr) return aCtr - bCtr;
        return bImp - aImp;
      });
    }
    return list;
  }, [jobs, activeSource, activeTab, searchText, sortMode, impFilter, freshFilter, latestByBranch]);

  /* 媒体ごとの登録件数(媒体タブ用) */
  const sourceCounts = useMemo(() => {
    const counts = {};
    SOURCES.forEach((s) => { counts[s.id] = 0; });
    Object.values(jobs).forEach((j) => { counts[sourceOf(j.jobId)] = (counts[sourceOf(j.jobId)] || 0) + 1; });
    return counts;
  }, [jobs]);

  /* 表示中の媒体における拠点ごとの件数(拠点タブ用) */
  const tabCounts = useMemo(() => {
    const inSource = Object.values(jobs).filter((j) => sourceOf(j.jobId) === activeSource);
    const counts = { all: inSource.length };
    branchesOf(activeSource).forEach((b) => { counts[b.id] = inSource.filter((j) => j.branch === b.id).length; });
    return counts;
  }, [jobs, activeSource]);

  function switchSource(sourceId) {
    setActiveSource(sourceId);
    setActiveTab("all");
  }

  /* ヘッダーのチェックボックスは、いま表示されている求人だけを対象にする */
  const allVisibleSelected = ranked.length > 0 && ranked.every(({ job }) => selectedIds.has(job.jobId));
  function toggleSelectAllVisible() {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (allVisibleSelected) ranked.forEach(({ job }) => next.delete(job.jobId));
      else ranked.forEach(({ job }) => next.add(job.jobId));
      return next;
    });
  }

  const selected = selectedJobId ? jobs[selectedJobId] : null;
  const selectedMetrics = selected ? deriveJobMetrics(selected) : null;

  return (
    <div className="jad-root">
      {/* 案件管理システムと同じサイトの別ページ。行き来できるようにタブを置く */}
      <nav className="jad-appnav">
        <a href="../">案件一覧</a>
        <a href="../#/postings">求人管理</a>
        <span className="is-active">成績ボード</span>
      </nav>

      <header className="jad-header">
        <div className="jad-header-title">
          <span className="jad-eyebrow">求人広告 運用ダッシュボード</span>
          <h1>成績優先度ボード</h1>
        </div>
        <div className="jad-header-meta">
          {reminder.isToday ? (
            <div className="jad-reminder is-today"><AlertTriangle size={16} />本日は更新日です。各拠点のCSVをインポートしてください。</div>
          ) : (
            <div className="jad-reminder"><Calendar size={16} />次回更新日まであと {reminder.daysUntil} 日(毎月10・20・30日)</div>
          )}
          <button className="jad-ghost-btn" onClick={exportBackup}><Download size={14} /> バックアップ保存</button>
          <button className="jad-ghost-btn" onClick={() => backupInputRef.current?.click()}><UploadCloud size={14} /> バックアップ復元</button>
          <input ref={backupInputRef} type="file" accept=".json" style={{ display: "none" }}
                 onChange={(e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ""; }} />
        </div>
      </header>

      <div className="jad-source-tabs">
        {SOURCES.map((s) => (
          <button key={s.id} className={"jad-source-tab " + (activeSource === s.id ? "is-active" : "")} onClick={() => switchSource(s.id)}>
            {s.label}<span className="jad-tab-count">{sourceCounts[s.id] || 0}</span>
          </button>
        ))}
      </div>

      {/* 拠点が5つ以上のときは1行4つで折り返す(エアワークは上4つ・下3つ) */}
      <section className="jad-import-row" style={{ "--jad-import-cols": Math.min(4, branchesOf(activeSource).length) }}>
        {branchesOf(activeSource).map((b) => {
          const key = `${activeSource}:${b.id}`;
          const branchIds = Object.values(jobs)
            .filter((j) => sourceOf(j.jobId) === activeSource && j.branch === b.id)
            .map((j) => j.jobId);
          return (
            <div key={key} className="jad-branch-card">
              <div className="jad-branch-name">{b.label}</div>
              <button className="jad-import-btn" disabled={busyBranch === key || !!loadError} onClick={() => fileInputs.current[key]?.click()}>
                {busyBranch === key ? <Loader2 size={16} className="jad-spin" /> : <Upload size={16} />}
                CSVを取り込む
              </button>
              <input ref={(el) => (fileInputs.current[key] = el)} type="file" accept=".csv" multiple style={{ display: "none" }}
                     onChange={(e) => { handleFiles(activeSource, b.id, e.target.files); e.target.value = ""; }} />
              <div className="jad-branch-count">
                <span>
                  登録求人数: {branchIds.length}件
                  {lastImport[key] && <span> ・最終取込 {lastImport[key].date}</span>}
                </span>
                {/* 0件でもボタンは置く。拠点ごとにカードの見た目が変わらないようにするため */}
                <button className="jad-card-del" disabled={!!loadError || branchIds.length === 0}
                        title={branchIds.length === 0 ? "削除する求人がありません" : ""}
                        onClick={() => askDelete(`${b.label} の登録求人 ${branchIds.length}件`, branchIds)}>
                  全件削除
                </button>
              </div>
            </div>
          );
        })}
      </section>

      {activeSource === "kyujinbox" && (
        <p className="jad-source-note">
          求人BOXのCSVは plus / next / up が1ファイルにまとまっているため、「勤務先名」から拠点を自動で振り分けます
          (判定できない行だけ、押したボタンの拠点に入ります)。ステータスが「募集停止」の求人は取り込みません。
        </p>
      )}

      <div className="jad-tabs">
        <button className={"jad-tab " + (activeTab === "all" ? "is-active" : "")} onClick={() => setActiveTab("all")}>全体<span className="jad-tab-count">{tabCounts.all}</span></button>
        {branchesOf(activeSource).map((b) => (
          <button key={b.id} className={"jad-tab " + (activeTab === b.id ? "is-active" : "")} onClick={() => setActiveTab(b.id)}>{b.label}<span className="jad-tab-count">{tabCounts[b.id]}</span></button>
        ))}
      </div>

      <div className="jad-toolbar">
        <input className="jad-search" type="text" placeholder="企業名・求人タイトルで検索" value={searchText} onChange={(e) => setSearchText(e.target.value)} />
        <div className="jad-sort-toggle">
          <button className={sortMode === "priority" ? "is-active" : ""} onClick={() => setSortMode("priority")}>優先度順</button>
          <button className={sortMode === "company" ? "is-active" : ""} onClick={() => setSortMode("company")}>企業名順</button>
        </div>
        <div className="jad-sort-toggle">
          <button className={impFilter === "all" ? "is-active" : ""} onClick={() => setImpFilter("all")}>すべて</button>
          <button className={impFilter === "shown" ? "is-active" : ""} onClick={() => setImpFilter("shown")}>表示あり</button>
          <button className={impFilter === "zero" ? "is-active" : ""} onClick={() => setImpFilter("zero")}>表示0</button>
        </div>
        <select className="jad-filter-select" value={freshFilter} onChange={(e) => setFreshFilter(e.target.value)}
                title="その拠点のいちばん新しい取り込みに載っていたかどうかで絞り込みます">
          <option value="all">取込：すべて</option>
          <option value="fresh">取込：最新に載っている</option>
          <option value="stale">取込：最新に載っていない</option>
        </select>
      </div>

      {freshFilter === "stale" && (
        <p className="jad-source-note">
          その拠点のいちばん新しい取り込みに載っていなかった求人です。掲載が終わっている可能性がありますが、
          <b>別の広告（キャンペーン）のCSVを取り込んだだけでもここに入ります</b>。消す前に中身を確認してください。
          見出し行のチェックボックスで表示中を全選択できます。
        </p>
      )}

      {selectedIds.size > 0 && (
        <div className="jad-bulk-bar">
          <span className="jad-bulk-count">{selectedIds.size}件を選択中</span>
          <input type="date" value={bulkDate} onChange={(e) => setBulkDate(e.target.value)} />
          <button className="jad-primary-btn" disabled={bulkBusy || !bulkDate} onClick={() => addRevisionToSelected(bulkDate)}>
            {bulkBusy ? <Loader2 size={14} className="jad-spin" /> : <Check size={14} />} まとめて修正日として登録
          </button>
          <button className="jad-ghost-btn danger" disabled={bulkBusy}
                  onClick={() => askDelete(`選択した求人 ${selectedIds.size}件`, Array.from(selectedIds))}>
            選択した求人を削除
          </button>
          <button className="jad-ghost-btn" onClick={() => setSelectedIds(new Set())}>選択を解除</button>
          <span className="jad-bulk-note">検索や絞り込みを変えても選択は残ります</span>
        </div>
      )}

      {loading ? (
        <div className="jad-empty"><Loader2 size={20} className="jad-spin" /> 読み込み中…</div>
      ) : loadError ? (
        <div className="jad-load-error">
          <div className="jad-load-error-head"><AlertTriangle size={16} /> データを読み込めませんでした</div>
          <p>{loadError}</p>
          <p className="jad-load-error-note">
            原因が解消するまで取り込みボタンは押せません。既存のデータを空の状態で上書きしてしまわないためです。
          </p>
          <button className="jad-primary-btn" onClick={() => window.location.reload()}>
            <RotateCcw size={14} /> 再読み込み
          </button>
        </div>
      ) : ranked.length === 0 ? (
        <div className="jad-empty">
          {searchText.trim()
            ? `「${searchText}」に一致する求人が見つかりません。`
            : activeTab === "all"
              ? `まだ${SOURCE_BY_ID[activeSource].label}のデータがありません。上のボタンから各拠点の${SOURCE_BY_ID[activeSource].fileHint}を取り込んでください。`
              : `${branchesOf(activeSource).find((b) => b.id === activeTab)?.label} の求人データがまだありません。`}
        </div>
      ) : (
        <section className="jad-table-wrap">
          <table className="jad-table">
            <thead>
              <tr>
                <th className="c-check" title="表示中の求人をすべて選択 / 解除">
                  <input type="checkbox" checked={allVisibleSelected}
                         onChange={toggleSelectAllVisible} />
                </th>
                <th className="c-rank">{sortMode === "priority" ? "優先度" : "#"}</th>
                {activeTab === "all" && <th className="c-branch">拠点</th>}
                <th className="c-name">求人 / 企業</th>
                <th className="c-num">表示数</th>
                <th className="c-num">応募数</th>
                <th className="c-num">クリック率</th>
                <th className="c-date">最終取込</th>
                <th className="c-date">直近修正日</th>
                <th className="c-num">経過日数</th>
                <th className="c-num">修正後<br/>クリック/日</th>
                <th className="c-num">修正前後<br/>変化</th>
                <th className="c-detail"></th>
              </tr>
            </thead>
            <tbody>
              {ranked.map(({ job, m }, idx) => (
                <tr key={job.jobId} className={sortMode === "priority" && idx < 3 ? "is-priority" : ""} onClick={() => setSelectedJobId(job.jobId)}>
                  {/* 行クリックは詳細を開くので、チェックボックスまで伝播させない */}
                  <td className="c-check" onClick={(e) => e.stopPropagation()}>
                    <input type="checkbox" checked={selectedIds.has(job.jobId)}
                           onChange={() => toggleSelect(job.jobId)} />
                  </td>
                  <td className="c-rank"><span className={"jad-rank-badge " + (sortMode === "priority" ? (idx < 3 ? "danger" : idx < 8 ? "warn" : "ok") : "ok")}>{idx + 1}</span></td>
                  {activeTab === "all" && <td className="c-branch">{job.branch}</td>}
                  <td className="c-name">
                    <div className="jad-job-name">{job.title}</div>
                    <div className="jad-job-sub">{job.company || "(企業名未判定)"} ・ ID:{displayJobId(job.jobId)}</div>
                  </td>
                  <td className="c-num">{m.latest ? fmtInt(m.latest.impressions) : "—"}</td>
                  <td className="c-num">{m.latest ? fmtInt(m.latest.applies) : "—"}</td>
                  <td className="c-num">{m.latest ? fmtPct(m.latest.ctr) : "—"}</td>
                  <td className={"c-date" + (isStale(job) ? " is-stale" : "")}>
                    {lastImportOf(job) || "—"}
                    {isStale(job) && <span className="jad-stale-tag">最新に無し</span>}
                  </td>
                  <td className="c-date">{m.lastRevision || "—"}</td>
                  <td className="c-num">{m.elapsedDays !== null ? m.elapsedDays + "日" : "—"}</td>
                  <td className="c-num">{m.clicksPerDaySinceRevision !== null ? m.clicksPerDaySinceRevision.toFixed(1) : "—"}</td>
                  <td className="c-num">
                    {m.changePct === null ? "—" : (
                      <span className={"jad-change " + (m.changePct >= 0 ? "up" : "down")}>
                        {m.changePct >= 0 ? <TrendingUp size={13} /> : <TrendingDown size={13} />}{Math.abs(m.changePct).toFixed(0)}%
                      </span>
                    )}
                  </td>
                  <td className="c-detail"><ChevronRight size={16} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      )}

      {Object.keys(jobs).length > 0 && (
        <div className="jad-footer-row">
          <button className="jad-ghost-btn" onClick={() => askDelete("すべての求人データ（全媒体・全拠点）", Object.keys(jobs))}>
            <RotateCcw size={14} /> 全データを削除
          </button>
        </div>
      )}

      {selected && selectedMetrics && (
        <DetailPanel job={selected} metrics={selectedMetrics} onClose={() => setSelectedJobId(null)}
                     onAddRevision={addRevision} onRemoveRevision={removeRevision}
                     onUpdateInfo={updateJobInfo} onDelete={deleteJob} />
      )}

      {confirmDel && (
        <div className="jad-overlay">
          <div className="jad-confirm">
            <p><strong>{confirmDel.label}</strong>を削除します。この操作は取り消せません。</p>
            <p className="jad-confirm-note">
              取り込んだ実績だけでなく、記録した修正日・タイトルの変更履歴・手入力した企業名も一緒に消えます。
              残しておきたい場合は、先にヘッダーの「バックアップ保存」を取ってください。
            </p>
            <div className="jad-confirm-actions">
              <button className="jad-ghost-btn" disabled={delBusy} onClick={() => setConfirmDel(null)}>キャンセル</button>
              <button className="jad-danger-btn" disabled={delBusy} onClick={runDelete}>
                {delBusy ? <Loader2 size={14} className="jad-spin" /> : null} 削除する
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className={"jad-toast " + toast.kind}>{toast.msg}</div>}
    </div>
  );
}

function DetailPanel({ job, metrics, onClose, onAddRevision, onRemoveRevision, onUpdateInfo, onDelete }) {
  const [newDate, setNewDate] = useState(todayStr());
  const [editing, setEditing] = useState(false);
  const [company, setCompany] = useState(job.company);
  const [branch, setBranch] = useState(job.branch);
  const [confirmDel, setConfirmDel] = useState(false);
  const jobSource = sourceOf(job.jobId);

  const chartData = metrics.snapDates.map((d) => ({ date: d, クリック数: job.snapshots[d].clicks, 応募数: job.snapshots[d].applies }));

  function saveEdit() {
    onUpdateInfo(job.jobId, { company, branch, companyManual: company !== job.company ? true : job.companyManual });
    setEditing(false);
  }

  return (
    <div className="jad-overlay" onClick={onClose}>
      <div className="jad-panel" onClick={(e) => e.stopPropagation()}>
        <div className="jad-panel-head">
          <button className="jad-icon-btn" onClick={onClose}><ChevronLeft size={16} /> 一覧へ戻る</button>
          <button className="jad-icon-btn" onClick={onClose}><X size={16} /></button>
        </div>

        {!editing ? (
          <div className="jad-panel-title-row">
            <div>
              <div className="jad-panel-eyebrow">{SOURCE_BY_ID[jobSource].label} ・ {branch} ・ 求人番号 {displayJobId(job.jobId)} ・ {job.employmentType}</div>
              <h2>{job.title}</h2>
              <div className="jad-panel-company"><Building2 size={13}/> {company || "(企業名未判定)"}</div>
            </div>
            <button className="jad-ghost-btn" onClick={() => setEditing(true)}>編集</button>
          </div>
        ) : (
          <div className="jad-edit-form">
            <label>拠点
              <select value={branch} onChange={(e) => setBranch(e.target.value)}>
                {branchesOf(jobSource).map((b) => <option key={b.id} value={b.id}>{b.label}</option>)}
              </select>
            </label>
            <label>{jobSource === "kyujinbox" ? "企業名(求人BOXのCSVには含まれないため手入力)" : "企業名(求人メモから自動判定・修正可)"}
              <input value={company} onChange={(e) => setCompany(e.target.value)} />
            </label>
            <div className="jad-edit-actions">
              <button className="jad-ghost-btn" onClick={() => setEditing(false)}>キャンセル</button>
              <button className="jad-primary-btn" onClick={saveEdit}><Check size={14}/> 保存</button>
            </div>
          </div>
        )}

        <div className="jad-memo-block"><FileText size={13} /> <span>{job.memo || (jobSource === "kyujinbox" ? "(勤務地情報なし)" : "(求人メモなし)")}</span></div>

        <div className="jad-metric-grid">
          <Metric label={jobSource === "kyujinbox" ? "応募数(集計期間の合計)" : "累計応募数(最新)"} value={metrics.latest ? fmtInt(metrics.latest.applies) : "—"} />
          <Metric label="クリック率(最新)" value={metrics.latest ? fmtPct(metrics.latest.ctr) : "—"} />
          <Metric label="直近修正日" value={metrics.lastRevision || "—"} />
          <Metric label="修正からの経過日数" value={metrics.elapsedDays !== null ? metrics.elapsedDays + "日" : "—"} />
          <Metric label="修正後クリック数/日" value={metrics.clicksPerDaySinceRevision !== null ? metrics.clicksPerDaySinceRevision.toFixed(1) : "—"} />
          <Metric label="修正前後の変化(クリック/日)"
                  value={metrics.changePct === null ? "データ不足" : (metrics.changePct >= 0 ? "+" : "") + metrics.changePct.toFixed(0) + "%"}
                  tone={metrics.changePct === null ? "" : metrics.changePct >= 0 ? "good" : "bad"} />
        </div>

        <div className="jad-chart-block">
          <h3>{jobSource === "kyujinbox" ? "取り込みごとの推移(クリック数 / 応募数・集計期間の合計)" : "取り込みごとの累計推移(クリック数 / 応募数)"}</h3>
          {chartData.length > 1 ? (
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={chartData} margin={{ top: 8, right: 16, left: -12, bottom: 0 }}>
                <CartesianGrid stroke="var(--jad-border)" strokeDasharray="3 4" vertical={false} />
                <XAxis dataKey="date" tick={{ fontSize: 10, fill: "var(--jad-ink-soft)" }} axisLine={{ stroke: "var(--jad-border)" }} tickLine={false} />
                <YAxis tick={{ fontSize: 11, fill: "var(--jad-ink-soft)" }} axisLine={false} tickLine={false} width={34}/>
                <RTooltip contentStyle={{ background: "var(--jad-surface)", border: "1px solid var(--jad-border)", borderRadius: 6, fontSize: 12 }} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
                {(job.revisions || []).map((r) => chartData.find((c) => c.date === r) ? (
                  <ReferenceLine key={r} x={r} stroke="var(--jad-gold)" strokeDasharray="4 3" label={{ value: "修正", fontSize: 10, fill: "var(--jad-gold)", position: "top" }} />
                ) : null)}
                <Line type="monotone" dataKey="クリック数" stroke="var(--jad-navy)" strokeWidth={2} dot={{ r: 3 }} />
                <Line type="monotone" dataKey="応募数" stroke="var(--jad-brick)" strokeWidth={2} dot={{ r: 3 }} />
              </LineChart>
            </ResponsiveContainer>
          ) : (
            <div className="jad-empty small">取り込みが2回分以上になるとグラフを表示します</div>
          )}
        </div>

        {job.titleHistory && job.titleHistory.length > 1 && (
          <div className="jad-title-history">
            <h3>求人タイトルの変更履歴</h3>
            <ul>{job.titleHistory.slice().reverse().map((t, i) => <li key={i}><span className="jad-th-date">{t.date}</span>{t.title}</li>)}</ul>
          </div>
        )}

        <div className="jad-revision-block">
          <h3>修正日(タイトル変化から自動検知・手動追加も可)</h3>
          <div className="jad-revision-add">
            <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} />
            <button className="jad-primary-btn" onClick={() => onAddRevision(job.jobId, newDate)}><Check size={14} /> 修正日として記録</button>
          </div>
          <ul className="jad-revision-list">
            {(job.revisions || []).slice().reverse().map((r) => (
              <li key={r}><span>{r}</span><button className="jad-icon-btn" onClick={() => onRemoveRevision(job.jobId, r)}><X size={13} /></button></li>
            ))}
            {(!job.revisions || job.revisions.length === 0) && <li className="jad-empty-line">まだ記録がありません</li>}
          </ul>
        </div>

        <div className="jad-panel-footer">
          {!confirmDel ? (
            <button className="jad-ghost-btn danger" onClick={() => setConfirmDel(true)}>この求人データを削除</button>
          ) : (
            <div className="jad-confirm-inline">
              <span>本当に削除しますか?</span>
              <button className="jad-ghost-btn" onClick={() => setConfirmDel(false)}>キャンセル</button>
              <button className="jad-danger-btn" onClick={() => onDelete(job.jobId)}>削除する</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Metric({ label, value, tone }) {
  return (
    <div className={"jad-metric " + (tone || "")}>
      <div className="jad-metric-value">{value}</div>
      <div className="jad-metric-label">{label}</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<JobAdDashboard />);

</script>

.jad-tab:hover { color: var(--jad-navy); }

.jad-job-name { font-weight: 600; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
